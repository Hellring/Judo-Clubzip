kind = "web"
previewPath = "/"
title = "JudoClub Manager"
version = "1.0.0"
id = "artifacts/judo-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21304

[services.development]
run = "pnpm --filter @workspace/judo-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/judo-app", "run", "build" ]
publicDir = "artifacts/judo-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21304"
BASE_PATH = "/"
