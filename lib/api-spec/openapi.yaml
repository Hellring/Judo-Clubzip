openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: JudoClub Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: admin
    description: Admin operations
  - name: clubs
    description: Club management
  - name: athletes
    description: Athlete management
  - name: payments
    description: Payment tracking
  - name: competitions
    description: Competition management
  - name: fights
    description: Fight management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users (super_admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAdmin"
    post:
      operationId: createAdminUser
      tags: [admin]
      summary: Create user directly without email confirmation (super_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAdmin"
        "400":
          description: Validation or Clerk error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /admin/invitations:
    post:
      operationId: createInvitation
      tags: [admin]
      summary: Send email invitation (super_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationResult"

  /admin/users/{userId}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update user role and club assignment (super_admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAdminUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAdmin"

  /clubs:
    get:
      operationId: listClubs
      tags: [clubs]
      summary: List all clubs
      responses:
        "200":
          description: List of clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Club"
    post:
      operationId: createClub
      tags: [clubs]
      summary: Create a new club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubInput"
      responses:
        "201":
          description: Created club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"

  /clubs/{clubId}:
    get:
      operationId: getClub
      tags: [clubs]
      summary: Get club by ID
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"
    patch:
      operationId: updateClub
      tags: [clubs]
      summary: Update club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubUpdate"
      responses:
        "200":
          description: Updated club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"
    delete:
      operationId: deleteClub
      tags: [clubs]
      summary: Delete club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clubs/{clubId}/athletes:
    get:
      operationId: listClubAthletes
      tags: [clubs]
      summary: List athletes of a club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Athletes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Athlete"

  /clubs/{clubId}/coaches:
    get:
      operationId: listClubCoaches
      tags: [clubs]
      summary: List coaches/admins of a club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Coaches list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAdmin"

  /clubs/{clubId}/stats:
    get:
      operationId: getClubStats
      tags: [clubs]
      summary: Get club statistics
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubStats"

  /clubs/{clubId}/members:
    get:
      operationId: listClubMembers
      tags: [clubs]
      summary: List coaches/members of a club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClubMember"
    post:
      operationId: addClubMember
      tags: [clubs]
      summary: Add a coach/member to a club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubMemberInput"
      responses:
        "201":
          description: Added member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubMember"

  /clubs/{clubId}/members/{memberId}:
    delete:
      operationId: removeClubMember
      tags: [clubs]
      summary: Remove a member from a club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /athletes:
    get:
      operationId: listAthletes
      tags: [athletes]
      summary: List athletes (optionally filtered by clubId)
      parameters:
        - name: clubId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of athletes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Athlete"
    post:
      operationId: createAthlete
      tags: [athletes]
      summary: Create a new athlete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteInput"
      responses:
        "201":
          description: Created athlete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Athlete"

  /athletes/{athleteId}:
    get:
      operationId: getAthlete
      tags: [athletes]
      summary: Get athlete by ID
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Athlete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Athlete"
    patch:
      operationId: updateAthlete
      tags: [athletes]
      summary: Update athlete
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthleteUpdate"
      responses:
        "200":
          description: Updated athlete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Athlete"
    delete:
      operationId: deleteAthlete
      tags: [athletes]
      summary: Delete athlete
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /athletes/{athleteId}/stats:
    get:
      operationId: getAthleteStats
      tags: [athletes]
      summary: Get athlete statistics (wins, losses, fights, points)
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Athlete stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AthleteStats"

  /athletes/{athleteId}/fights:
    get:
      operationId: getAthleteFights
      tags: [athletes]
      summary: Get fight history for an athlete
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fight history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FightWithContext"

  /athletes/{athleteId}/weight-logs:
    get:
      operationId: listWeightLogs
      tags: [athletes]
      summary: List weight log history for an athlete
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Weight log list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightLog"
    post:
      operationId: addWeightLog
      tags: [athletes]
      summary: Add a weight log entry for an athlete
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightLogInput"
      responses:
        "201":
          description: Created weight log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightLog"

  /athletes/{athleteId}/weight-logs/{logId}:
    delete:
      operationId: deleteWeightLog
      tags: [athletes]
      summary: Delete a weight log entry
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: integer
        - name: logId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /athletes/{athleteId}/payments:
    get:
      operationId: getAthletePayments
      tags: [payments]
      summary: Get payment history for an athlete
      parameters:
        - name: athleteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments (filtered by clubId or athleteId)
      parameters:
        - name: clubId
          in: query
          schema:
            type: integer
        - name: athleteId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [paid, pending, overdue]
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Create a payment record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{paymentId}:
    patch:
      operationId: updatePayment
      tags: [payments]
      summary: Update a payment (mark paid, etc.)
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentUpdate"
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
    delete:
      operationId: deletePayment
      tags: [payments]
      summary: Delete a payment record
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clubs/{clubId}/payment-summary:
    get:
      operationId: getClubPaymentSummary
      tags: [payments]
      summary: Get payment summary for a club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSummary"

  /competitions:
    get:
      operationId: listCompetitions
      tags: [competitions]
      summary: List competitions (optionally filtered by clubId)
      parameters:
        - name: clubId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of competitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Competition"
    post:
      operationId: createCompetition
      tags: [competitions]
      summary: Create a competition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionInput"
      responses:
        "201":
          description: Created competition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"

  /competitions/{competitionId}:
    get:
      operationId: getCompetition
      tags: [competitions]
      summary: Get competition by ID
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Competition with weight categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionDetail"
    patch:
      operationId: updateCompetition
      tags: [competitions]
      summary: Update competition
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionUpdate"
      responses:
        "200":
          description: Updated competition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"
    delete:
      operationId: deleteCompetition
      tags: [competitions]
      summary: Delete competition
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /competitions/{competitionId}/categories:
    get:
      operationId: listWeightCategories
      tags: [competitions]
      summary: List weight categories for competition
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Weight categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeightCategory"
    post:
      operationId: createWeightCategory
      tags: [competitions]
      summary: Add a weight category to a competition
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightCategoryInput"
      responses:
        "201":
          description: Created weight category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightCategory"

  /competitions/{competitionId}/categories/{categoryId}:
    patch:
      operationId: updateWeightCategory
      tags: [competitions]
      summary: Update weight category settings (timer, waza-ari threshold)
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeightCategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeightCategory"
    delete:
      operationId: deleteWeightCategory
      tags: [competitions]
      summary: Remove weight category
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /competitions/{competitionId}/participants:
    get:
      operationId: listParticipants
      tags: [competitions]
      summary: List participants in a competition
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Participant"
    post:
      operationId: addParticipant
      tags: [competitions]
      summary: Register an athlete for a competition
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantInput"
      responses:
        "201":
          description: Added participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"

  /competitions/{competitionId}/participants/{participantId}:
    delete:
      operationId: removeParticipant
      tags: [competitions]
      summary: Remove participant from competition
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
        - name: participantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /competitions/{competitionId}/generate-bracket:
    post:
      operationId: generateBracket
      tags: [competitions]
      summary: Generate bracket/schedule for a competition category
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateBracketInput"
      responses:
        "200":
          description: Generated fights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fight"

  /competitions/{competitionId}/fights:
    get:
      operationId: listFights
      tags: [fights]
      summary: List fights in a competition
      parameters:
        - name: competitionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fight"

  /fights/{fightId}:
    get:
      operationId: getFight
      tags: [fights]
      summary: Get fight details
      parameters:
        - name: fightId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fight with events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FightDetail"
    patch:
      operationId: updateFight
      tags: [fights]
      summary: Update fight (scores, winner, status)
      parameters:
        - name: fightId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FightUpdate"
      responses:
        "200":
          description: Updated fight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fight"

  /fights/{fightId}/start:
    post:
      operationId: startFight
      tags: [fights]
      summary: Start a fight (begin timer)
      parameters:
        - name: fightId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Started fight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fight"

  /fights/{fightId}/finish:
    post:
      operationId: finishFight
      tags: [fights]
      summary: Finish a fight and record result
      parameters:
        - name: fightId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishFightInput"
      responses:
        "200":
          description: Finished fight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fight"

  /fights/{fightId}/events:
    get:
      operationId: listFightEvents
      tags: [fights]
      summary: List score events in a fight
      parameters:
        - name: fightId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fight events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FightEvent"
    post:
      operationId: addFightEvent
      tags: [fights]
      summary: Add a score event to a fight (ippon, waza-ari, shido, hansoku)
      parameters:
        - name: fightId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FightEventInput"
      responses:
        "201":
          description: Added event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FightEvent"

  /fights/{fightId}/events/{eventId}:
    delete:
      operationId: deleteFightEvent
      tags: [fights]
      summary: Delete a fight event (undo)
      parameters:
        - name: fightId
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [super_admin, club_admin, coach, athlete, parent]
        clubId:
